<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Stickman Ping Pong</title>
<style>
  :root { --bg: #f4c430; --ink: #111; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 0; width: 100%;
    text-align: center; pointer-events: none;
  }
  #score { font-size: 42px; font-weight: bold; line-height: 1; }
  #score.match { font-size: 30px; }
  #sub { font-size: 13px; font-weight: bold; opacity: .55; margin-top: 5px; }
  #message { margin-top: 8px; font-size: 17px; font-weight: bold; }
  #leftHint, #rightHint {
    position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 50%;
    text-align: center; font-size: 16px; font-weight: bold; opacity: .35; pointer-events: none;
  }
  #leftHint { left: 0; }
  #rightHint { right: 0; }
  #swipeHint {
    position: fixed; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); width: 100%;
    text-align: center; font-size: 13px; font-weight: bold; opacity: .35; pointer-events: none;
  }
  .corner {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 6;
    width: 38px; height: 38px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: 3px solid var(--ink); border-radius: 10px; background: transparent;
    font: bold 15px Arial, "PingFang SC", sans-serif; color: var(--ink); cursor: pointer;
  }
  .corner svg { width: 20px; height: 20px; }
  .corner:focus-visible, .modeBtn:focus-visible, .iconBtn:focus-visible { outline: 3px dashed var(--ink); outline-offset: 3px; }
  .left { left: 10px; }
  #langBtn { right: 56px; }
  #soundBtn { right: 10px; }
  #menu {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 24px; background: rgba(244, 196, 48, .96); text-align: center;
  }
  #menu[hidden], .corner[hidden], .panel[hidden], #help[hidden], #intro[hidden], .line[hidden] { display: none; }
  #intro {
    position: fixed; inset: 0; z-index: 9;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    padding: 24px; background: rgba(244, 196, 48, .96); cursor: pointer;
  }
  #intro .line { display: flex; align-items: center; gap: 12px; width: min(380px, 92vw); animation: pop .18s ease-out; }
  #intro .line.b { justify-content: flex-end; }
  #intro .head { width: 46px; height: 46px; flex: none; }
  #intro .bubble {
    position: relative; background: #fff; border: 3px solid var(--ink); border-radius: 14px;
    padding: 10px 14px; font-size: 16px; font-weight: bold; line-height: 1.45;
  }
  #intro .a .bubble::before, #intro .b .bubble::before {
    content: ""; position: absolute; top: 50%; width: 12px; height: 12px; background: #fff;
    border: 3px solid var(--ink); transform: translateY(-50%) rotate(45deg);
  }
  #intro .a .bubble::before { left: -8px; border-top: none; border-right: none; }
  #intro .b .bubble::before { right: -8px; border-bottom: none; border-left: none; }
  #introSkip {
    position: absolute; right: 20px; bottom: calc(22px + env(safe-area-inset-bottom, 0px));
    font-size: 14px; font-weight: bold; opacity: .55; padding: 8px;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #menu h1 { font-size: 30px; margin: 0 0 10px; }
  .modeBtn {
    width: min(260px, 78vw); padding: 14px 0;
    font: bold 22px Arial, "PingFang SC", sans-serif; color: var(--ink);
    background: #fff; border: 4px solid var(--ink); border-radius: 14px;
    box-shadow: 0 5px 0 var(--ink); cursor: pointer;
  }
  .modeBtn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  #levels { display: flex; gap: 8px; margin-bottom: 14px; }
  #chars { display: flex; gap: 8px; margin-bottom: 8px; }
  #chars button {
    display: flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px;
    border: 3px solid var(--ink); border-radius: 19px; background: transparent; color: var(--ink);
    font: bold 14px Arial, "PingFang SC", sans-serif; cursor: pointer;
  }
  #chars button.on { background: #fff; }
  #chars button:focus-visible { outline: 3px dashed var(--ink); outline-offset: 2px; }
  #chars .dot { width: 12px; height: 12px; border-radius: 50%; }
  #levels button, .iconBtn {
    width: 38px; height: 38px; border: 3px solid var(--ink); border-radius: 10px;
    background: transparent; color: var(--ink); font: bold 16px Arial, sans-serif; cursor: pointer;
  }
  #levels button.on { background: var(--ink); color: var(--bg); }
  .iconBtn { border-radius: 50%; margin-left: 4px; }
  .iconBtn.on { background: var(--ink); color: var(--bg); }
  .panel {
    background: #fff; border: 3px solid var(--ink); border-radius: 12px;
    padding: 12px 16px; font-size: 14px; line-height: 1.7; text-align: left;
    max-width: min(320px, 86vw);
  }
  #lvInfo { margin: -6px 0 12px; }
  #lvInfo div { opacity: .55; }
  #lvInfo div.on { opacity: 1; font-weight: bold; }
  #help {
    position: fixed; inset: 0; z-index: 7;
    display: flex; align-items: center; justify-content: center;
    background: rgba(244, 196, 48, .9);
  }
  #hints { transition: opacity .6s; }
  #hints.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div id="score">0</div>
  <div id="sub"></div>
  <div id="message"></div>
</div>

<div id="hints">
  <div id="swipeHint"></div>
  <div id="leftHint">← LEFT</div>
  <div id="rightHint">RIGHT →</div>
</div>

<button id="helpBtn" class="corner left" aria-label="How to play">?</button>
<button id="menuBtn" class="corner left" aria-label="Menu" hidden>
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
</button>
<button id="langBtn" class="corner" aria-label="Language">EN</button>
<button id="soundBtn" class="corner" aria-label="Sound"></button>

<div id="menu">
  <h1>Stickman Ping Pong</h1>
  <div id="chars">
    <button data-char="normal"><span class="dot" style="background:#111"></span><span data-i18n-char="normal"></span></button>
    <button data-char="zhu"><span class="dot" style="background:#2563eb"></span><span data-i18n-char="zhu"></span></button>
    <button data-char="wang"><span class="dot" style="background:#d62828"></span><span data-i18n-char="wang"></span></button>
  </div>
  <button class="modeBtn" data-mode="match" data-i18n="match"></button>
  <div id="levels">
    <button data-lv="1">1</button><button data-lv="2">2</button><button data-lv="3">3</button><button data-lv="4">4</button>
    <button id="lvInfoBtn" class="iconBtn" aria-label="Levels">!</button>
  </div>
  <div id="lvInfo" class="panel" hidden></div>
  <button class="modeBtn" data-mode="practice" data-i18n="practice"></button>
</div>

<div id="help" hidden><div class="panel" id="helpText"></div></div>

<div id="intro" hidden>
  <div class="line a">
    <svg class="head" viewBox="0 0 46 46" style="color:#666"><circle cx="23" cy="23" r="18" fill="none" stroke="currentColor" stroke-width="5"/></svg>
    <div class="bubble" id="introA"></div>
  </div>
  <div class="line b" id="introLineB" hidden>
    <div class="bubble" id="introB"></div>
    <svg class="head" id="introHeadB" viewBox="0 0 46 46"><circle cx="23" cy="23" r="18" fill="none" stroke="currentColor" stroke-width="5"/></svg>
  </div>
  <div id="introSkip"></div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const subEl = document.getElementById("sub");
const msgEl = document.getElementById("message");
const menuEl = document.getElementById("menu");
const menuBtn = document.getElementById("menuBtn");
const helpBtn = document.getElementById("helpBtn");
const langBtn = document.getElementById("langBtn");
const helpEl = document.getElementById("help");
const hintsEl = document.getElementById("hints");
const introEl = document.getElementById("intro");
const soundBtn = document.getElementById("soundBtn");

let INK = "#111", BG = "#f4c430";
const CHAR_COLOR = { zhu: "#2563eb", wang: "#d62828" };

const I18N = {
  zh: {
    match: "11 分赛", practice: "无尽模式",
    chars: { normal: "普通", zhu: "老朱", wang: "王大力" },
    introA: "听说大学乒乓球部今年有个新生，谁都打不过他，好像姓马？",
    introB: "真的？我去会会他", skip: "跳过 ›",
    lv: ["一级", "二级", "三级", "四级"],
    lvDesc: ["AI 不打旋转，球速慢", "AI 会打上旋和下旋", "全部旋转，相持更久", "球更快，AI 会打你的空当"],
    help: ["点左 / 右半屏：平击", "上滑：拉上旋　下滑：搓下旋",
           "早打斜线，晚打直线；晚打能压到边线",

    retry: "点击重新开始", win: "你赢了", lose: "你输了", again: "点击再来一局",
    wrong: "打错边了", missed: "没接到", out: "出界", net: "下网",
    aiMissed: "AI 没接到", aiError: "AI 失误", fault: "发球失误", error: "出错了",
    eatTop: "吃上旋", eatBack: "吃下旋", weak: "勉强回球", aiOutPos: "AI 失位", heavy: "强", smash: "扣杀",
    spin: { top: "上旋", back: "下旋", side: "侧旋", topSide: "侧上旋", backSide: "侧下旋", flat: "平击" }
  },
  en: {
    match: "Match to 11", practice: "Endless",
    chars: { normal: "Classic", zhu: "JOO", wang: "WANG" },
    introA: "Heard the uni table tennis club got a freshman nobody can beat. His name's Ma, I think?",
    introB: "Really? I'll go take him on.", skip: "Skip ›",
    lv: ["Lv 1", "Lv 2", "Lv 3", "Lv 4"],
    lvDesc: ["No spin, slow balls", "Topspin and backspin", "All spins, longer rallies", "Faster, hits to open space"],
    help: ["Tap left / right half: flat hit", "Swipe up: topspin　Swipe down: backspin",
           "Early goes cross-court, late goes down the line to the sideline",
           "Faster stripes and a darker trail mean heavier spin",
           "Topspin needs a topspin stroke, backspin needs a chop",
           "Wrong stroke on light spin: weak return. On heavy spin: point lost",
           "A high ball from the AI is a smash chance",
           "JOO: swipe down chops back any topspin; 3 PERFECT chops force a high ball",
           "WANG: his topspin beats any spin, and rallies keep speeding up",
           "Keys: A D flat, Q E topspin, Z C backspin"],
    swipe: "↑ topspin　↓ backspin",
    youServe: "You serve", aiServe: "AI serves", serveTip: "Tap or swipe to serve",
    retry: "Tap to retry", win: "You win", lose: "You lose", again: "Tap to play again",
    wrong: "Wrong side", missed: "Missed", out: "Out", net: "Net",
    aiMissed: "AI missed", aiError: "AI error", fault: "Fault", error: "Error",
    eatTop: "Too much topspin", eatBack: "Too much backspin", weak: "Weak return", aiOutPos: "AI out of position", heavy: "Heavy ", smash: "Smash",
    spin: { top: "Topspin", back: "Backspin", side: "Sidespin", topSide: "Top-side", backSide: "Back-side", flat: "Flat" }
  }
};
let lang = /^zh/i.test(navigator.language || "") ? "zh" : "en";
try { const l = localStorage.getItem("spp_lang"); if (I18N[l]) lang = l; } catch (e) {}
const T = k => I18N[lang][k];
const RED = "#d62828", BLUE = "#1d4ed8", PURPLE = "#7b2cbf";
const TAU = Math.PI * 2;
const STEP = 1 / 240;
const ZE = 0.22;   // 击球区：击球线之前（秒）
const ZL = 0.12;   // 击球区：击球线之后（秒）
const LIGHT = 0.15;   // 旋转可见阈值（上旋/下旋）
const HEAVY = 0.42;   // 强旋转阈值
const AIM_LINE = 0.46;   // 直线最大落点：压边线（台宽比例，0.5 为边线）
const AIM_CROSS = 0.34;  // 斜线最大落点：对方半台中部偏外

// 11 分赛难度
const LEVELS = {
  1: { types: { flat: 1 }, mag: 0, T: 1.2, fxMax: 0.34, n: 0,
       perf: [0.06, 0.13], fat: [6, 15], press: 1.2, aiSpeed: 0.5, react: 0.15 },
  2: { types: { top: 3, back: 3, side: 1 }, mag: 0.2, T: 1.05, fxMax: 0.38, n: 4,
       perf: [0.05, 0.11], fat: [14, 30], press: 0.55, aiSpeed: 0.62, react: 0.12 },
  3: { types: { top: 3, back: 3, side: 2, topSide: 2, backSide: 2 }, mag: 0.4, T: 0.9, fxMax: 0.42, n: 9,
       perf: [0.045, 0.1], fat: [28, 50], press: 0.45, aiSpeed: 0.75, react: 0.08 },
  4: { types: { top: 3, back: 3, side: 2.5, topSide: 2.5, backSide: 2.5 }, mag: 0.55, T: 0.74, fxMax: 0.42, n: 15,
       perf: [0.04, 0.09], fat: [45, 80], press: 0.5, aiSpeed: 0.9, react: 0.05, hunt: true }
};
const PRACTICE_PERF = [0.05, 0.11];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

let W = 0, H = 0, S = 1;
const L = {};

function layout() {
  S = clamp(Math.min(W, H) / 520, 0.75, 1.3);
  L.tl = W * 0.15; L.tr = W * 0.85; L.tw = L.tr - L.tl;
  L.tt = H * 0.32; L.tb = H * 0.68;
  L.net = H / 2; L.half = L.net - L.tt;
  L.netH = 14 * S;
  L.playerY = H * 0.78; L.aiY = H * 0.22;
  L.playerHitY = L.playerY - 22 * S;
  L.aiHitY = L.aiY + 22 * S;
  L.reach = 50 * S;
  L.G = H * 1.7;
  L.ballR = 7 * S;
}

const game = {
  mode: "practice", state: "idle", level: 2, rally: 0,
  score: 0, best: 0, p: 0, a: 0, server: "ai", winner: null,
  overT: 0, serveT: 0, deadT: 0, time: 0,
  shake: 0, hitstop: 0, slowmo: 0, focus: 0,
  char: "normal", combo: 0, comboT: 9, tempo: 0, zhuDots: 0, zhuSlow: 0,
  zoom: 0, impact: 0, boost: 0,
  sqT: 9, sqType: "bounce", pulse: 0, smashChain: 0
};
try { game.best = +localStorage.getItem("spp_best") || 0; } catch (e) {}
try { const c = localStorage.getItem("spp_char"); if (c === "normal" || c === "zhu" || c === "wang") game.char = c; } catch (e) {}
try { const lv = +localStorage.getItem("spp_level"); if (LEVELS[lv]) game.level = lv; } catch (e) {}

function makeMan() { return { x: 0, tx: 0, y: 0, vx: 0, lean: 0, dir: 1, stroke: "top", swingT: 9, returnT: 0, fast: false, cheer: 0, sad: 0 }; }
const player = makeMan();
const ai = makeMan();

let ball = null;
let hintHits = 0;
let pending = null;
let gesture = null;
const effects = [];
const trail = [];

/* ================= 声音 ================= */

let actx = null, noiseBuf = null, master = null, masterLP = null, crowdGain = null, muted = false;
try { muted = localStorage.getItem("spp_muted") === "1"; } catch (e) {}

function ensureAudio() {
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      masterLP = actx.createBiquadFilter();
      masterLP.type = "lowpass"; masterLP.frequency.value = 20000;
      masterLP.connect(actx.destination);
      master = masterLP;
      const n = Math.floor(actx.sampleRate * 0.25);
      noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    if (!crowdGain) {
      // 观众底噪：循环的低沉噪声，音量随回合长度升高
      const len = Math.floor(actx.sampleRate * 2);
      const buf = actx.createBuffer(1, len, actx.sampleRate);
      const d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) { last = last * 0.97 + (Math.random() * 2 - 1) * 0.03; d[i] = last * 6; }
      const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 650; bp.Q.value = 0.6;
      crowdGain = actx.createGain(); crowdGain.gain.value = 0;
      src.connect(bp); bp.connect(crowdGain); crowdGain.connect(master);
      src.start();
    }
    if (actx.state === "suspended") actx.resume();
  } catch (e) {}
}

function blip(o) {
  if (!actx || muted) return;
  const t = actx.currentTime + (o.delay || 0);
  const out = actx.createBiquadFilter();
  out.type = "lowpass"; out.frequency.value = o.lp || 8000;
  out.connect(master);

  const g = actx.createGain();
  g.gain.setValueAtTime(o.vol, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + o.dur);
  g.connect(out);
  const osc = actx.createOscillator();
  osc.type = o.type || "triangle";
  osc.frequency.setValueAtTime(o.f, t);
  osc.frequency.exponentialRampToValueAtTime(o.f2 || o.f * 0.6, t + o.dur);
  osc.connect(g);
  osc.start(t); osc.stop(t + o.dur + 0.02);

  if (o.noise) {
    const src = actx.createBufferSource();
    src.buffer = noiseBuf;
    const bp = actx.createBiquadFilter();
    bp.type = "bandpass"; bp.frequency.value = o.nf || 3000; bp.Q.value = 1.2;
    const ng = actx.createGain();
    ng.gain.setValueAtTime(o.vol * o.noise, t);
    ng.gain.exponentialRampToValueAtTime(0.0008, t + 0.03);
    src.connect(bp); bp.connect(ng); ng.connect(out);
    src.start(t); src.stop(t + 0.05);
  }
}

const SFX = {
  hit(stroke, vol = 1, perfect = false, pitch = 1) {
    const q = stroke === "top" ? { f: 1500, f2: 850, dur: .06, lp: 9000, noise: .8, nf: 4500 }
            : stroke === "chop" ? { f: 750, f2: 420, dur: .09, lp: 2200, noise: .35, nf: 1500 }
            : { f: 1150, f2: 700, dur: .07, lp: 6000, noise: .55, nf: 3000 };
    const p = { ...q, f: q.f * pitch, f2: q.f2 * pitch, nf: q.nf * pitch };
    blip({ ...p, vol: 0.35 * vol });
    if (perfect === "perfect") blip({ f: p.f * 2, f2: p.f * 1.4, dur: .14, vol: .12, type: "sine" });
    else if (perfect === "good") blip({ f: p.f * 1.5, f2: p.f * 1.2, dur: .08, vol: .06, type: "sine" });
  },
  bounce(onTable) {
    blip(onTable ? { f: 950, f2: 650, dur: .05, vol: .28, noise: .5, nf: 2500, lp: 5000 }
                 : { f: 420, f2: 300, dur: .06, vol: .18, noise: .3, nf: 1200, lp: 2000 });
  },
  whoosh() {
    if (!actx || muted) return;
    const t = actx.currentTime;
    const src = actx.createBufferSource(); src.buffer = noiseBuf;
    const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.5;
    bp.frequency.setValueAtTime(700, t); bp.frequency.exponentialRampToValueAtTime(5000, t + 0.12);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0008, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.16);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t); src.stop(t + 0.2);
  },
  cheer(level) {                    // 长回合结束的欢呼
    if (!actx || muted) return;
    const t = actx.currentTime, v = 0.08 + 0.12 * level;
    const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1400; bp.Q.value = 0.5;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0008, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.12);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 1.1);
    const lfo = actx.createOscillator(); lfo.frequency.value = 7;
    const lg = actx.createGain(); lg.gain.value = v * 0.35;
    lfo.connect(lg); lg.connect(g.gain);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t); src.stop(t + 1.15); lfo.start(t); lfo.stop(t + 1.15);
  },
  chime() {
    blip({ f: 1320, f2: 1320, dur: .18, vol: .08, type: "sine" });
    blip({ f: 1760, f2: 1760, dur: .22, vol: .06, type: "sine", delay: .07 });
  },
  smash(chain = 0) {
    const pk = 1 + 0.1 * chain;
    blip({ f: 1900 * pk, f2: 650 * pk, dur: .1, vol: .45, noise: 1, nf: 5200, lp: 11000 });
    blip({ f: 150, f2: 60, dur: .2, vol: .4, type: "sine" });
  },
  net() { blip({ f: 180, f2: 90, dur: .16, vol: .35, type: "sine", noise: .6, nf: 600, lp: 900 }); },
  point(win) {
    if (win) {
      blip({ f: 660, f2: 660, dur: .12, vol: .16, type: "sine" });
      blip({ f: 990, f2: 990, dur: .2, vol: .16, type: "sine", delay: .1 });
    } else {
      blip({ f: 330, f2: 320, dur: .14, vol: .15, type: "sine" });
      blip({ f: 220, f2: 200, dur: .24, vol: .15, type: "sine", delay: .12 });
    }
  }
};

function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

const SPEAKER = '<svg viewBox="0 0 20 20" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l4-3v10l-4-3H3z"/>';
function refreshSoundBtn() {
  soundBtn.innerHTML = SPEAKER + (muted
    ? '<path d="M13.5 7.5l5 5M18.5 7.5l-5 5" fill="none"/></svg>'
    : '<path d="M13.5 7a4 4 0 0 1 0 6M15.5 5a7 7 0 0 1 0 10" fill="none"/></svg>');
}
soundBtn.addEventListener("click", () => {
  muted = !muted;
  try { localStorage.setItem("spp_muted", muted ? "1" : "0"); } catch (e) {}
  ensureAudio();
  refreshSoundBtn();
  soundBtn.blur();
});
refreshSoundBtn();

/* ================= 球的物理 ================= */

function stepBall(b, dt) {
  const G = b.bounced ? b.G2 : b.G1;
  b.x += b.vx * dt + 0.5 * b.ax * dt * dt;
  b.vx += b.ax * dt;
  b.vy *= (1 - b.drag * dt);
  b.y += b.vy * dt;
  b.z += b.vz * dt - 0.5 * G * dt * dt;
  b.vz -= G * dt;
  b.spin += b.spinRate * dt;
  if (!b.bounced) {
    if ((b.y - b.bounceY) * Math.sign(b.vy) >= 0) {
      b.bounced = true;
      b.z = 0;
      b.vz = Math.abs(b.vz) * b.e;
      b.vy *= b.k;
      b.vx += b.kick;
      b.ax *= 0.55;
    }
  } else if (b.z < 0) {
    b.z = 0;
    b.vz = Math.abs(b.vz) * 0.45;
    b.fb = (b.fb || 0) + 1;
  }
}

function simulate(b0, targetY, dir, check) {
  const b = { ...b0 };
  let t = 0, T1 = 0, bx = 0, zNet = null, minX = b.x, maxX = b.x, res = null, tEnd = 0, xEnd = null;
  const endLine = dir > 0 ? L.tb : L.tt;
  const xs = check ? [] : null;
  for (let i = 0; i < 1900; i++) {
    const wasB = b.bounced;
    stepBall(b, STEP); t += STEP;
    if (xs) xs.push(b.x);
    if (res) { if (t >= tEnd) break; continue; }
    if (!wasB && b.bounced) { T1 = t; bx = b.x; }
    if (zNet === null && (b.y - L.net) * dir >= 0) zNet = b.z;
    if (xEnd === null && (b.y - endLine) * dir >= 0) xEnd = b.x;
    if (b.x < minX) minX = b.x;
    if (b.x > maxX) maxX = b.x;
    if ((b.y - targetY) * dir >= 0) {
      res = { t, T1, bx, x: b.x, zNet, minX, maxX, xEnd };
      if (!check) return res;
      tEnd = t + ZL;
    }
  }
  if (!res) return null;
  if (check) {
    // 击球区时间窗内，球不能越过中线
    let s0 = 0, crossed = false;
    for (let i = Math.max(0, Math.floor((res.t - ZE) / STEP)); i < xs.length; i++) {
      const sg = Math.sign(xs[i] - W / 2);
      if (!s0) s0 = sg; else if (sg !== s0) crossed = true;
    }
    res.zoneSign = s0; res.crossed = crossed;
  }
  return res;
}

function planShot(from, toPlayer, o) {
  const dir = toPlayer ? 1 : -1;
  const targetY = toPlayer ? L.playerHitY : L.aiHitY;
  const b = {
    x: from.x, y: from.y, z: from.z, vx: 0, vy: 0, vz: 0,
    ax: o.spinS * L.tw * 1.3 / (o.T * o.T),
    kick: o.spinS * L.tw * 0.35,
    G1: L.G, G2: o.lob ? L.G * 0.6 : L.G,
    drag: 0.1 + Math.max(0, -o.spinT) * 0.7,
    // 落台后前冲速度倍率：侧旋/平击 1.0，上旋 1.2，下旋 0.8
    k: o.spinT > 0.15 ? 1.2 : o.spinT < -0.15 ? 0.8 : 1.0,
    e: o.lob ? 1.0 : clamp(0.8 - 0.3 * o.spinT, 0.55, 0.98),
    bounceY: o.bounceY, bounced: false,
    spin: 0, spinRate: isHeavy(o) ? 46 : 16,
    spinT: o.spinT, spinS: o.spinS, toPlayer, still: false
  };
  const d1 = Math.abs(o.bounceY - from.y), d2 = Math.abs(targetY - o.bounceY);
  let vy = (d1 + d2 / b.k) / o.T, r;
  for (let i = 0; i < 3; i++) {
    b.vy = dir * vy;
    r = simulate(b, targetY, dir, null);
    if (!r) return null;
    vy *= r.t / o.T;
  }
  b.vy = dir * vy;
  r = simulate(b, targetY, dir, null);
  if (!r || !r.T1) return null;
  const T1 = r.T1;
  let G1 = o.lob ? L.G * 0.6 : L.G * clamp(1 + 0.5 * o.spinT, 0.55, 1.6);
  const clear = L.netH + 7 * S;
  for (let i = 0; i < 10; i++) {
    b.G1 = G1;
    b.vz = (0.5 * G1 * T1 * T1 - b.z) / T1;
    r = simulate(b, targetY, dir, null);
    if (r && r.zNet !== null && r.zNet >= clear) break;
    G1 *= 1.3;
  }
  const r0 = simulate({ ...b, vx: 0 }, targetY, dir, null);
  const r1 = simulate({ ...b, vx: 1 }, targetY, dir, null);
  if (!r0 || !r1) return null;
  const c = r1.x - r0.x;
  if (Math.abs(c) < 1e-6) return null;
  if (o.bx != null) {
    // 按落台点瞄准（玩家回球）
    const cb = r1.bx - r0.bx;
    if (Math.abs(cb) < 1e-6) return null;
    b.vx = (o.bx - r0.bx) / cb;
  } else {
    b.vx = (o.fx - r0.x) / c;
  }
  const bx = r0.bx + (r1.bx - r0.bx) * b.vx;
  const rf = simulate(b, targetY, dir, toPlayer);
  if (!rf) return null;
  if (o.bx != null) o.fx = rf.x;
  return { ball: b, o, bx, rf, side: Math.sign(o.fx - W / 2) || 1 };
}

function validShot(p, toPlayer) {
  const m = 8 * S;
  if (p.bx < L.tl + m || p.bx > L.tr - m) return false;
  if (p.rf.minX < 12 || p.rf.maxX > W - 12) return false;
  if (p.rf.xEnd != null && (p.rf.xEnd < L.tl + 2 * S || p.rf.xEnd > L.tr - 2 * S)) return false;
  if (toPlayer) {
    if (p.rf.crossed || p.rf.zoneSign !== p.side) return false;
    if (Math.abs(p.o.fx - W / 2) < 10 * S) return false;
  }
  return true;
}

function makeShot(from, toPlayer, gen) {
  for (let i = 0; i < 16; i++) {
    const p = planShot(from, toPlayer, gen(i));
    if (p && validShot(p, toPlayer)) return p;
  }
  for (let i = 0; i < 4; i++) {
    const side = Math.random() < .5 ? -1 : 1;
    const o = {
      spinT: 0.25, spinS: 0, side,
      fx: W / 2 + side * L.tw * (toPlayer ? 0.28 : 0.2),
      bounceY: toPlayer ? L.net + L.half * 0.6 : L.net - L.half * 0.6,
      T: 1
    };
    const p = planShot(from, toPlayer, o);
    if (p) return p;
  }
  return null;
}

// 失误球：下网或出界
function makeErrorShot(from, hitter, kind, spinT, sideSign) {
  const toPlayer = hitter === "ai";
  const dir = toPlayer ? 1 : -1;
  const fx = W / 2 + rand(-0.3, 0.3) * L.tw;
  const b = {
    x: from.x, y: from.y, z: from.z, vx: 0, vy: 0, vz: 0, ax: 0, kick: 0,
    G1: L.G, G2: L.G, drag: 0, k: 1, e: 0.6, bounced: false,
    spin: 0, spinRate: 22, spinT, spinS: 0, toPlayer, still: false,
    error: kind === "wide" ? "out" : kind, hitter, hdir: dir
  };
  if (kind === "wide") {          // 角度太大，出边线
    const endY = toPlayer ? L.net + L.half * rand(0.5, 0.8) : L.net - L.half * rand(0.5, 0.8);
    const endX = (sideSign || 1) > 0 ? L.tr + rand(12, 30) * S : L.tl - rand(12, 30) * S;
    const t = rand(0.6, 0.75);
    b.vy = dir * Math.abs(endY - from.y) / t;
    b.vz = (0.5 * L.G * t * t - b.z) / t;
    b.bounceY = endY;
    b.vx = (endX - from.x) / t;
  } else if (kind === "net") {
    const t = rand(0.35, 0.5);
    b.vy = dir * Math.abs(L.net - from.y) / t;
    b.vz = (0.35 * L.netH - b.z + 0.5 * L.G * t * t) / t;
    b.bounceY = dir * H * 5;
    b.vx = (fx - from.x) / t * 0.5;
  } else {
    const endY = toPlayer ? L.tb + rand(20, 45) * S : L.tt - rand(20, 45) * S;
    const t = rand(0.55, 0.75);
    b.vy = dir * Math.abs(endY - from.y) / t;
    b.G1 = L.G * 0.8;
    b.vz = (0.5 * b.G1 * t * t - b.z) / t;
    b.bounceY = endY;
    b.vx = (fx - from.x) / t;
  }
  return b;
}

function level() {
  return game.mode === "practice" ? game.score : LEVELS[game.level].n;
}

function pickType(types) {
  const entries = Object.entries(types);
  let r = Math.random() * entries.reduce((s, e) => s + e[1], 0);
  for (const [t, w] of entries) { if ((r -= w) <= 0) return t; }
  return entries[0][0];
}

function genSpin(type, mag) {
  const sg = Math.random() < .5 ? -1 : 1;
  let spinT = 0, spinS = 0;
  if (type === "flat") { spinT = rand(-0.1, 0.12); spinS = rand(-0.1, 0.1); }
  else if (type === "top") spinT = rand(0.3, 0.3 + mag);
  else if (type === "back") spinT = -rand(0.3, 0.25 + mag * 0.8);
  else if (type === "side") { spinS = sg * rand(0.35, 0.35 + mag); spinT = rand(-0.1, 0.15); }
  else if (type === "topSide") { spinT = rand(0.25, 0.25 + mag * 0.7); spinS = sg * rand(0.3, 0.3 + mag * 0.8); }
  else { spinT = -rand(0.25, 0.2 + mag * 0.7); spinS = sg * rand(0.3, 0.3 + mag * 0.8); }
  return { spinT, spinS };
}

function finishAiShot(spinT, spinS, side, fxMax, T, attempt) {
  if (attempt > 6) spinS *= 0.5;
  if (attempt > 11) spinS = 0;
  const fx = W / 2 + side * L.tw * rand(0.13, fxMax);
  const depth = spinT < -0.15 ? rand(0.3, 0.6) : spinT > 0.2 ? rand(0.55, 0.88) : rand(0.4, 0.85);
  if (spinT > 0.2) T *= 0.93;
  if (spinT < -0.15) T *= 1.07;
  return { spinT, spinS, side, fx, bounceY: L.net + L.half * depth, T };
}

// 练习模式：越打越难
function aiShotPractice(n, attempt) {
  const lv = Math.min(1, n / 16);
  const type = pickType({
    top: 3, back: 2 + 2 * lv, side: 0.6 + 3 * lv,
    topSide: n >= 3 ? 0.3 + 2 * lv : 0, backSide: n >= 5 ? 2 * lv : 0
  });
  const { spinT, spinS } = genSpin(type, 0.3 + 0.55 * lv);
  const T = clamp(1.25 - n * 0.035, 0.62, 1.25) * rand(0.92, 1.08);
  return finishAiShot(spinT, spinS, Math.random() < .5 ? -1 : 1, 0.42, T, attempt);
}

// 11 分赛：固定难度，只随比分极轻微提速
function aiShotMatch(attempt) {
  const cfg = LEVELS[game.level];
  const { spinT, spinS } = genSpin(pickType(cfg.types), cfg.mag);
  const progress = Math.min(1, (game.p + game.a) / 20);
  const T = cfg.T * (1 - 0.04 * progress) * rand(0.94, 1.06);
  let side = Math.random() < .5 ? -1 : 1;
  if (cfg.hunt && Math.abs(player.x - W / 2) > 20 * S && Math.random() < 0.7) side = -Math.sign(player.x - W / 2);
  return finishAiShot(spinT, spinS, side, cfg.fxMax, T, attempt);
}

function aiShotOptions(attempt) {
  return game.mode === "practice" ? aiShotPractice(game.score, attempt) : aiShotMatch(attempt);
}

// 玩家回球：落台点 bx 由击球时机决定
function playerShotOptions(attempt, stroke, grade, n, bx) {
  const T0 = clamp(1.1 - n * 0.03, 0.6, 1.1) * rand(0.95, 1.05);
  let spinT, spinS, depth, T;
  if (stroke === "top") { spinT = rand(0.45, 0.75); spinS = rand(-0.3, 0.3); depth = rand(0.5, 0.88); T = T0 * 0.9; }
  else if (stroke === "chop") { spinT = -rand(0.35, 0.65); spinS = rand(-0.15, 0.15); depth = rand(0.3, 0.6); T = T0 * 1.12; }
  else { spinT = rand(-0.05, 0.1); spinS = rand(-0.2, 0.2); depth = rand(0.4, 0.85); T = T0 * 0.95; }
  if (grade === "perfect") T *= 0.88;
  else if (grade === "good") T *= 0.95;
  if (attempt > 2) spinS *= 0.4;
  if (attempt > 5) spinS = 0;
  if (attempt > 3) bx = W / 2 + (bx - W / 2) * Math.max(0.3, 1 - 0.05 * (attempt - 3));
  return { spinT, spinS, bx, bounceY: L.net - L.half * depth, T };
}

// 时机 → 落台点：连续曲线。早（负）打斜线，晚（正）打直线
// 直线可以压到边线，斜线收在台内，都不会出台
function aimX(te, dir) {
  const u = te < 0 ? clamp(te / ZE, -1, 0) : clamp(te / ZL, 0, 1);
  const a = Math.sign(u) * (1 - Math.pow(1 - Math.abs(u), 1.8));
  const off = a >= 0 ? a * AIM_LINE : a * AIM_CROSS;
  const bx0 = W / 2 + dir * off * L.tw;
  const bx = clamp(bx0 + rand(-0.01, 0.01) * L.tw, L.tl + 0.03 * L.tw, L.tr - 0.03 * L.tw);
  return { u, bx, bx0 };
}

// AI 失误率：体力（随回合板数）+ 压力（回球质量与跑动）
function aiMissChance(press) {
  if (game.mode !== "match") return 0;
  const cfg = LEVELS[game.level];
  const n = game.rally;
  const [s0, s1] = cfg.fat;
  const fat = n < s0 ? 0.01 : clamp(0.01 + 0.9 * Math.pow((n - s0) / (s1 - s0), 2), 0, 0.95);
  return clamp(1 - (1 - fat) * (1 - press * cfg.press), 0, 0.95);
}

function perfWindow() {
  return game.mode === "practice" ? PRACTICE_PERF : LEVELS[game.level].perf;
}

function spinColor(b) {
  if (!b) return "#555";
  if (b.spinT > LIGHT) return RED;
  if (b.spinT < -LIGHT) return BLUE;
  if (Math.abs(b.spinS) > 0.2) return PURPLE;
  return "#555";
}

// 上/下旋看 spinT；纯侧旋看 spinS
function isHeavy(b) {
  if (!b) return false;
  return Math.abs(b.spinT || 0) > LIGHT ? Math.abs(b.spinT) >= HEAVY : Math.abs(b.spinS || 0) >= HEAVY;
}

function spinName(o) {
  const sp = T("spin");
  const s = Math.abs(o.spinS) > 0.2 ? (o.spinS < 0 ? " ←" : " →") : "";
  let name;
  if (o.spinT > 0.2 && s) name = sp.topSide + s;
  else if (o.spinT < -0.2 && s) name = sp.backSide + s;
  else if (s) name = sp.side + s;
  else if (o.spinT > LIGHT) name = sp.top;
  else if (o.spinT < -LIGHT) name = sp.back;
  else return sp.flat;
  return (isHeavy(o) ? T("heavy") : "") + name;
}

/* ================= 角色 ================= */

function addRally() {
  game.rally++;
  if (game.rally % 10 === 0) { game.pulse = 1; SFX.chime(); }   // 10 / 20 / 30 板
}

function playerColor() { return CHAR_COLOR[game.char] || INK; }

// 该打法接这个来球是否"打错"：返回 "out" / "net" / null
function wrongStroke(inc, stroke) {
  if (game.char === "wang" && stroke === "top") return null;        // 王大力：拉球不怕任何旋转
  if (inc > LIGHT && stroke !== "top") {
    if (game.char === "zhu" && stroke === "chop") return null;      // 老朱：削球接上旋
    return "out";
  }
  if (inc < -LIGHT && stroke !== "chop") return "net";
  return null;
}

/* ================= 流程 ================= */

function updateScore() {
  if (game.mode === "practice") {
    scoreEl.className = "";
    scoreEl.textContent = game.score;
    subEl.textContent = "BEST " + game.best;
  } else {
    scoreEl.className = "match";
    scoreEl.textContent = `YOU ${game.p} : ${game.a} AI`;
    const lvName = T("lv")[game.level - 1];
    subEl.textContent = game.state === "over" ? lvName : lvName + "　" + T(game.server === "player" ? "youServe" : "aiServe");
  }
}

function resetMen() {
  player.cheer = player.sad = ai.cheer = ai.sad = 0;
  player.x = player.tx = W / 2;
  ai.x = ai.tx = W / 2;
  player.lean = ai.lean = 0;
  player.swingT = ai.swingT = 9;
  player.returnT = ai.returnT = 0;
  ai.delay = 0; ai.dive = 0;
  player.fast = ai.fast = false;
}

function toIdle() {
  game.state = "idle";
  resetMen();
  ball = null; pending = null; gesture = null;
  trail.length = 0; effects.length = 0;
  msgEl.textContent = "";
  scoreEl.textContent = ""; subEl.textContent = "";
  menuEl.hidden = false;
  menuBtn.hidden = true;
  helpBtn.hidden = false;
}

function startMode(mode) {
  ensureAudio();
  game.mode = mode;
  menuEl.hidden = true;
  menuBtn.hidden = false;
  helpBtn.hidden = true;
  helpEl.hidden = true;
  lvInfo.hidden = true; lvInfoBtn.classList.remove("on");
  game.score = 0; game.p = 0; game.a = 0;
  game.combo = 0; game.zhuDots = 0; game.smashChain = 0;
  effects.length = 0;
  setupServe();
}

function computeServer() {
  const total = game.p + game.a;
  const idx = total < 20 ? Math.floor(total / 2) : total - 10;
  return idx % 2 === 0 ? "player" : "ai";
}

function setupServe() {
  game.server = game.mode === "practice" ? "ai" : computeServer();
  game.state = "serve";
  game.serveT = game.mode === "practice" ? 0.5 : 0.6;
  resetMen();
  pending = null; gesture = null;
  trail.length = 0;
  game.rally = 0;
  game.tempo = 0;
  game.combo = 0;               // 每一分重新计算 PERFECT 连击（练习模式只在开局发球一次，不受影响）
  game.focus = 0; game.zhuSlow = 0; game.zoom = 0;
  const base = { vx: 0, vy: 0, vz: 0, still: true, spin: 0, spinT: 0, spinS: 0, bounced: false, toPlayer: false };
  if (game.server === "ai") {
    ai.dir = Math.random() < .5 ? -1 : 1;
    ball = { ...base, x: ai.x + ai.dir * L.reach, y: L.aiHitY, z: L.netH * 1.4 };
    msgEl.textContent = "";
  } else {
    ball = { ...base, x: player.x + player.dir * L.reach, y: L.playerHitY, z: L.netH * 1.4 };
    msgEl.textContent = T("serveTip");
  }
  updateScore();
}

function fail(reason) {           // 练习模式结束
  game.state = "over";
  game.overT = 0;
  pending = null;
  if (game.score > game.best) {
    game.best = game.score;
    try { localStorage.setItem("spp_best", game.best); } catch (e) {}
  }
  updateScore();
  msgEl.textContent = T(reason) + (lang === "zh" ? "，" : " — ") + T("retry");
  celebrate(false);
  game.shake = 5 * S;
  SFX.point(false);
  buzz([30, 40, 30]);
}

function endRally(winner, reason) { // 11 分赛的一分结束
  if (game.state !== "play") return;
  game.state = "dead";
  game.deadT = 0;
  game.winner = winner;
  pending = null;
  msgEl.textContent = T(reason);
  celebrate(winner === "player");
  SFX.point(winner === "player");
  if (winner === "ai") buzz([30, 40, 30]);
}

// 得分庆祝 / 失分低头；长回合结束有欢呼
function celebrate(playerWon) {
  const win = playerWon ? player : ai, loss = playerWon ? ai : player;
  win.cheer = 0.9; win.sad = 0;
  loss.sad = 0.9; loss.cheer = 0;
  if (game.rally >= 8) SFX.cheer(Math.min(1, (game.rally - 8) / 20));
}

function lose(reason) {
  game.combo = 0;
  game.smashChain = 0;
  if (game.mode === "practice") fail(reason);
  else endRally("ai", reason);
}

function rallyError(b, reason) {
  if (b.hitter === "player") lose(reason);
  else endRally("player", reason);
}

function awardPoint() {
  if (game.winner === "player") game.p++; else game.a++;
  if ((game.p >= 11 || game.a >= 11) && Math.abs(game.p - game.a) >= 2) {
    game.state = "over";
    game.overT = 0;
    updateScore();
    msgEl.textContent = T(game.p > game.a ? "win" : "lose") + (lang === "zh" ? "　" : " — ") + T("again");
    return;
  }
  setupServe();
}

/* ================= 击球 ================= */

function aiHit() {
  const from = { x: ball.x, y: ball.y, z: Math.max(ball.z, L.netH * 0.9) };
  ai.dir = from.x < ai.x ? -1 : 1;
  ai.swingT = 0;
  ai.returnT = 0.35;
  effects.push({ type: "burst", x: from.x, y: from.y - from.z, t: 0, dur: 0.22 });

  if (ball.aiMiss === "error") {
    const kind = Math.random() < .5 ? "net" : "out";
    const st = rand(-0.4, 0.5);
    ai.stroke = st < -0.15 ? "chop" : "top";
    ball = makeErrorShot(from, "ai", kind, st);
    SFX.hit(ai.stroke, 0.7);
    return;
  }

  addRally();
  const wasWeak = ball.weak;
  const chance = !!ball.aiChance;
  const zhuChance = !!ball.zhuChance;
  const tempoK = game.char === "wang" ? Math.max(0.7, 1 - 0.03 * game.tempo) : 1;
  const p = makeShot(from, true, i => {
    const o = aiShotOptions(i);
    o.T *= tempoK;                   // 王大力：越打越快
    if (chance) {                    // AI 被动回高球 → 扣杀机会
      o.spinT = rand(-0.05, 0.05); o.spinS = 0;
      o.T = Math.max(o.T, 1.0) * 1.2;
      o.bounceY = L.net + L.half * rand(0.55, 0.8);
      o.fx = W / 2 + o.side * L.tw * rand(0.18, 0.34);
      o.lob = true;
    } else if (wasWeak && i < 12) {         // 机会球：AI 强攻
      o.T *= 0.72;
      o.spinT = rand(0.45, 0.7);
      o.spinS *= 0.3;
      o.fx = W / 2 + o.side * L.tw * rand(0.28, 0.42);
      o.bounceY = L.net + L.half * rand(0.6, 0.88);
    }
    return o;
  });
  if (!p) { endRally("player", "aiError"); return; }
  ball = p.ball;
  ball.side = p.side;
  ball.hitter = "ai";
  ball.hdir = 1;
  ball.chance = chance;
  ball.fromZhu = chance && zhuChance;
  game.sqT = 0; game.sqType = "hit";
  ai.stroke = ball.spinT < -0.15 ? "chop" : "top";
  SFX.hit(ball.spinT < -0.15 ? "chop" : ball.spinT > 0.15 ? "top" : "flat", 0.7);
  if (!chance) effects.push({ type: "text", x: W / 2, y: L.tt - 14 * S, text: spinName(p.o), color: spinColor(ball), size: 18, t: 0, dur: 0.9 });
}

function launchPlayerShot(p, stroke, grade, press) {
  ball = p.ball;
  game.sqT = 0; game.sqType = "hit";
  ball.hitter = "player";
  ball.hdir = -1;
  addRally();
  ai.dir = p.o.fx < W / 2 ? -1 : 1;
  const proper = clamp(p.o.fx - ai.dir * L.reach, W * 0.04, W * 0.96);
  ai.returnT = 0;
  ai.fast = false;

  if (game.mode === "match") {
    // 失位：AI 在反应时间之后以最大速度跑动，仍够不到就必丢
    const cfg = LEVELS[game.level];
    const tAvail = Math.max(0, p.rf.t - cfg.react);
    const maxRun = cfg.aiSpeed * L.tw * tAvail + 14 * S;
    const need = Math.abs(proper - ai.x);
    ai.delay = cfg.react;
    if (need > maxRun) {
      ball.aiMiss = "outpos";
    } else {
      const run = need / maxRun;
      if (Math.random() < aiMissChance(press + run * run * 0.15)) {
        ball.aiMiss = Math.random() < 0.55 ? "whiff" : "error";
      }
    }
    if (ball.aiMiss === "whiff") ai.delay += 0.25;
    // 一部分 AI 失误改为回高球，把得分机会变成扣杀
    if (ball.aiMiss === "error" && Math.random() < 0.5) { ball.aiMiss = null; ball.aiChance = true; }
    else if (!ball.aiMiss && need > 0.8 * maxRun && Math.random() < 0.25) ball.aiChance = true;
  } else if (game.score >= 3 && Math.random() < 0.05 + (grade === "perfect" ? 0.1 : 0)) {
    ball.aiChance = true;
  }
  ai.tx = proper;

  const streak = game.mode === "practice" ? game.score : Math.floor(game.rally / 2);
  SFX.hit(stroke, 1, grade, 1 + Math.min(streak, 30) * (game.char === "wang" ? 0.02 : 0.01));
  buzz(grade === "perfect" ? 30 : 12);
}

function playerServe(dir, stroke) {
  player.dir = dir; player.stroke = stroke; player.swingT = 0;
  const from = { x: clamp(player.x + dir * L.reach, 20, W - 20), y: L.playerHitY - 4 * S, z: L.netH * 1.3 };
  game.state = "play";
  msgEl.textContent = "";
  const bx = W / 2 + L.tw * rand(-0.34, 0.34);
  const p = makeShot(from, false, i => playerShotOptions(i, stroke, null, level(), bx));
  if (!p) { endRally("ai", "fault"); return; }
  effects.push({ type: "burst", x: from.x, y: from.y - from.z, t: 0, dur: 0.22 });
  launchPlayerShot(p, stroke, null, 0.02);
}

function playerHit(dir, stroke, te) {
  player.dir = dir; player.stroke = stroke;
  player.swingT = 0; player.fast = true;

  if (dir !== ball.side) {
    player.tx = W / 2 + dir * Math.min(W * 0.16, L.tw * 0.3);
    player.returnT = 0;
    lose("wrong");
    return;
  }

  // 时间判定：te < 0 为早，te > 0 为晚（秒）
  const [pw, gw] = perfWindow();
  let grade = Math.abs(te) <= pw ? "perfect" : Math.abs(te) <= gw ? "good" : null;
  if (game.char === "wang" && stroke === "top" && !ball.chance) grade = "perfect";   // 王大力：拉球必 PERFECT
  player.tx = clamp(ball.x - dir * L.reach, W * 0.06, W * 0.94);
  player.returnT = 0.45;

  if (ball.chance) { smash(dir, te); return; }

  // 吃转判定：轻旋转打错 → 勉强回球；强旋转打错 → 失误
  const inc = ball.spinT || 0;
  const heavy = Math.abs(inc) >= HEAVY;
  const wrong = wrongStroke(inc, stroke);
  let err = null, weak = false;
  if (wrong) { if (heavy) err = wrong; else weak = true; }

  const aim = aimX(te, dir);

  const from = { x: ball.x, y: ball.y, z: Math.max(ball.z, L.netH * 0.9) };
  effects.push({ type: "burst", x: from.x, y: from.y - from.z, t: 0, dur: 0.25 });

  if (err) {
    ball = makeErrorShot(from, "player", err, stroke === "top" ? 0.5 : stroke === "chop" ? -0.5 : 0, Math.sign(aim.bx - W / 2));
    game.combo = 0;
    SFX.hit(stroke);
    buzz(12);
    effects.push({ type: "text", x: W / 2, y: L.tb + 22 * S, text: T(inc > 0 ? "eatTop" : "eatBack"), color: inc > 0 ? RED : BLUE, size: 18, t: 0, dur: 0.9 });
    return;
  }

  if (game.mode === "practice") { game.score++; updateScore(); }
  if (++hintHits === 3) hintsEl.classList.add("gone");

  let p;
  if (weak) {
    // 勉强回球：慢、高、偏中路，AI 下一板会强攻
    const bx = W / 2 + (aim.bx - W / 2) * 0.3;
    p = makeShot(from, false, i => {
      const o = playerShotOptions(i, "flat", null, level(), bx);
      o.T *= 1.3; o.spinS = 0; o.bounceY = L.net - L.half * rand(0.5, 0.8);
      return o;
    });
  } else if (game.char === "zhu" && stroke === "chop") {
    // 老朱削球：强下旋 + 往外侧拐的侧旋
    p = makeShot(from, false, i => {
      const o = playerShotOptions(i, "chop", grade, level(), aim.bx);
      o.spinT = -rand(0.5, 0.7);
      o.spinS = i > 5 ? 0 : dir * rand(0.3, 0.5) * (i > 2 ? 0.4 : 1);
      return o;
    });
  } else {
    p = makeShot(from, false, i => {
      const o = playerShotOptions(i, stroke, grade, level(), aim.bx);
      if (game.char === "wang" && stroke === "top") o.T *= 0.85;   // 王大力拉球更快
      return o;
    });
  }
  if (!p) { lose("error"); return; }

  let press = 0;
  if (!weak) {
    press = 0.02 + (grade === "perfect" ? 0.07 : grade === "good" ? 0.03 : 0);
    if (stroke === "top") press += 0.02;
    if (stroke === "top" && inc < -LIGHT) press += 0.05;
    if (stroke === "flat" && Math.abs(inc) <= LIGHT) press += 0.04;
  }
  launchPlayerShot(p, stroke, weak ? null : grade, press);
  if (weak) {
    ball.weak = true;
    game.combo = 0;
    effects.push({ type: "text", x: W / 2, y: L.tb + 22 * S, text: T("weak"), color: inc > 0 ? RED : BLUE, size: 16, t: 0, dur: 0.8 });
    return;
  }

  // PERFECT 连击
  if (grade === "perfect") { game.combo++; game.comboT = 0; } else game.combo = 0;

  if (game.char === "wang" && stroke === "top") game.tempo++;

  // 老朱：3 次 PERFECT 削球 → AI 必回高球
  if (game.char === "zhu" && stroke === "chop" && grade === "perfect") {
    game.zhuDots++;
    if (game.zhuDots >= 3) {
      game.zhuDots = 0;
      if (ball.aiMiss !== "outpos") { ball.aiMiss = null; ball.aiChance = true; ball.zhuChance = true; }
    }
  }

  // 真正打准的 PERFECT 才有顿帧；王大力的拉球保持连贯节奏
  if (grade === "perfect" && !(game.char === "wang" && stroke === "top")) {
    game.shake = 2 * S;
    game.hitstop = 0.05;
    game.slowmo = 0.12;
  }
}

// 扣杀：快、准、AI 接不到（练习模式 +2）
function smash(dir, te) {
  const aim = aimX(te, dir);
  const from = { x: ball.x, y: ball.y, z: Math.max(ball.z, L.netH * 1.2) };
  effects.push({ type: "burst", x: from.x, y: from.y - from.z, t: 0, dur: 0.3 });
  if (game.mode === "practice") { game.score += 2; updateScore(); }
  const p = makeShot(from, false, i => {
    const o = playerShotOptions(i, "top", "perfect", level(), aim.bx);
    o.T = 0.42; o.spinT = 0.3; o.spinS = 0;
    o.bounceY = L.net - L.half * rand(0.55, 0.85);
    return o;
  });
  if (!p) { lose("error"); return; }
  launchPlayerShot(p, "top", "perfect", 0);
  ball.aiChance = false;
  ball.smash = true;
  ball.e = 1.05; ball.G2 = L.G * 0.8;          // 落台后弹高飞出
  if (game.mode === "match") { ball.aiMiss = "smashed"; ai.delay += 0.15; }
  game.combo++; game.comboT = 0;

  // 击球瞬间：声音由闷变清亮、冲击帧、镜头回弹、快慢对比
  if (masterLP) { masterLP.frequency.cancelScheduledValues(actx.currentTime); masterLP.frequency.setValueAtTime(20000, actx.currentTime); }
  game.smashChain++;
  const chain = Math.min(game.smashChain - 1, 3);
  ball.chain = chain;
  SFX.whoosh();
  SFX.smash(chain);
  buzz(40);
  game.focus = 0;
  game.hitstop = 0.08;
  game.impact = 0.06;
  game.zoom = -0.02;
  game.boost = 0.1;
  game.shake = (5 + chain * 1.5) * S;
  trail.length = 0;
  effects.push({ type: "speed", t: 0, dur: 0.3, chain });
}

// 球到击球线的时间差（秒）：负为早，正为晚
function timing(b) { return (b.y - L.playerHitY) / b.vy; }

function inZone(b) {
  if (!b || !b.toPlayer || b.error || !b.bounced || b.still || b.vy <= 0) return false;
  const te = timing(b);
  return te >= -ZE && te <= ZL;
}

function doAction(dir, stroke, g) {
  if (game.state === "serve") {
    if (game.server === "player") playerServe(dir, stroke);
    else { player.dir = dir; player.stroke = stroke; player.swingT = 0; }
    return;
  }
  if (game.state !== "play") return;

  const b = ball;
  const can = b && b.toPlayer && !b.error && !b.still && b.bounced;
  if (can && (inZone(b) || (g && (g.zoneAtPress || g.enteredTe != null)))) {
    const te = g ? (g.zoneAtPress ? g.pressTe : (g.enteredTe != null ? g.enteredTe : timing(b))) : timing(b);
    playerHit(dir, stroke, te);
    return;
  }

  // 提前出手：先跑位，0.2 秒内球进入击球区就自动击球
  player.dir = dir; player.stroke = stroke;
  player.swingT = 0; player.fast = true;
  pending = { dir, stroke, t: game.time };
  player.tx = W / 2 + dir * Math.min(W * 0.14, L.tw * 0.25);
  player.returnT = 0.5;
}

/* ================= 更新 ================= */

function physicsStep() {
  const b = ball;
  const wasB = b.bounced, fb = b.fb || 0;
  stepBall(b, STEP);

  if (!wasB && b.bounced) {
    game.sqT = 0; game.sqType = "bounce";
    const onTable = b.y > L.tt && b.y < L.tb && b.x > L.tl && b.x < L.tr;
    if (b.smash) {
      effects.push({ type: "bigring", x: b.x, y: b.y, t: 0, dur: 0.45, chain: b.chain || 0 });
      effects.push({ type: "splat", x: b.x, y: b.y, t: 0, dur: 0.4, seed: Math.random() * 10 });
      game.shake = Math.max(game.shake, 3 * S);
      SFX.bounce(true); SFX.bounce(true);
    } else {
      effects.push({ type: "ring", x: b.x, y: b.y, t: 0, dur: 0.35 });
      SFX.bounce(onTable);
    }
    if (b.error === "out" && !b.resolved) { b.resolved = true; rallyError(b, "out"); }
  } else if ((b.fb || 0) > fb && b.fb <= 2) {
    SFX.bounce(false);
  }

  if (b.error === "net" && !b.netted && (b.y - L.net) * b.hdir >= 0) {
    b.netted = true;
    b.vy = -b.vy * 0.12;
    b.vx *= 0.3;
    b.vz = Math.min(b.vz, 0) * 0.2;
    b.bounced = true;
    SFX.net();
    rallyError(b, "net");
  }

  if (game.state !== "play") {
    if (b.y > H + 80 || b.y < -80 || b.x < -80 || b.x > W + 80) ball = null;
    return;
  }

  if (b.toPlayer) {
    if (b.error) return;
    if (gesture && !gesture.zoneAtPress && gesture.enteredTe == null && inZone(b)) gesture.enteredTe = timing(b);
    if (pending) {
      if (game.time - pending.t > 0.2) pending = null;
      else if (inZone(b)) { const pd = pending; pending = null; playerHit(pd.dir, pd.stroke, timing(b)); return; }
    }
    if (b.bounced && timing(b) > ZL + 0.02) {
      const holding = gesture && (gesture.zoneAtPress || gesture.enteredTe != null);
      if (!holding) lose("missed");
    }
  } else if (!b.error && b.y <= L.aiHitY) {
    if (b.aiMiss === "whiff" || b.aiMiss === "outpos" || b.aiMiss === "smashed") {
      if (!b.whiffed) {
        b.whiffed = true;
        ai.swingT = 0; ai.stroke = "top";
        if (b.aiMiss === "smashed") {   // 扑救
          ai.dive = 0.5;
          ai.tx = clamp(b.x - ai.dir * L.reach * 0.6, W * 0.04, W * 0.96);
        }
      }
      if (b.y < L.aiY - 50 * S) endRally("player", b.aiMiss === "outpos" ? "aiOutPos" : b.aiMiss === "smashed" ? "smash" : "aiMissed");
    } else {
      aiHit();
    }
  }
}

function moveMan(e, dt, rateNormal) {
  if (e.returnT > 0) {
    e.returnT -= dt;
    if (e.returnT <= 0) { e.tx = W / 2; e.fast = false; }
  }
  const rate = e.fast ? 26 : rateNormal;
  const nx = e.x + (e.tx - e.x) * (1 - Math.exp(-rate * dt));
  e.vx = dt > 0 ? (nx - e.x) / dt : 0;
  e.x = nx;
  if (Math.abs(e.tx - e.x) < 1.5) e.fast = false;
  const targetLean = clamp(e.vx / (1400 * S), -0.4, 0.4);
  e.lean += (targetLean - e.lean) * (1 - Math.exp(-14 * dt));
  e.swingT += dt;
}

// 11 分赛：AI 有反应时间和最大移动速度
function moveAI(dt) {
  const e = ai, cfg = LEVELS[game.level];
  if (e.returnT > 0) {
    e.returnT -= dt;
    if (e.returnT <= 0) e.tx = W / 2;
  }
  let nx = e.x;
  const diving = e.dive > 0;
  if (diving) e.dive -= dt;
  if (e.delay > 0 && !diving) e.delay -= dt;
  else {
    const max = cfg.aiSpeed * L.tw * dt * (diving ? 2.5 : 1);
    nx = e.x + clamp(e.tx - e.x, -max, max);
  }
  e.vx = dt > 0 ? (nx - e.x) / dt : 0;
  e.x = nx;
  const targetLean = diving ? Math.sign(e.tx - e.x || 1) * 0.7 : clamp(e.vx / (700 * S), -0.4, 0.4);
  e.lean += (targetLean - e.lean) * (1 - Math.exp(-14 * dt));
  e.swingT += dt;
}

let acc = 0;
function update(dt) {
  game.time += dt;

  if (gesture && game.time - gesture.t0 > 0.16) resolveGesture("flat");

  // 扣杀机会：球在我方落台后聚焦 + 慢动作
  const wantFocus = game.state === "play" && ball && ball.chance && ball.toPlayer && ball.bounced && !ball.error ? 1 : 0;
  game.focus += (wantFocus - game.focus) * (1 - Math.exp(-(wantFocus ? 14 : 8) * dt));

  // 老朱：强上旋在他这边落台后放慢（不压暗）
  const wantZhu = game.char === "zhu" && game.state === "play" && ball && ball.toPlayer && ball.bounced &&
    !ball.error && !ball.chance && (ball.spinT || 0) >= HEAVY && timing(ball) <= ZL ? 1 : 0;
  game.zhuSlow += (wantZhu - game.zhuSlow) * (1 - Math.exp(-(wantZhu ? 12 : 16) * dt));

  // 镜头：扣杀机会时缓慢推近，击球后快速回弹
  const zoomTarget = game.focus * 0.04;
  game.zoom += (zoomTarget - game.zoom) * (1 - Math.exp(-(game.focus > 0.05 ? 5 : 18) * dt));
  if (game.impact > 0) game.impact -= dt;

  // 慢动作时声音变闷
  if (masterLP && actx) masterLP.frequency.setTargetAtTime(lerp(20000, 1100, game.focus), actx.currentTime, 0.03);

  let pdt = dt;
  if (game.hitstop > 0) { game.hitstop -= dt; pdt = 0; }
  else if (game.boost > 0) { game.boost -= dt; pdt = dt * 1.3; }
  else if (game.slowmo > 0) { game.slowmo -= dt; pdt = dt * 0.35; }
  pdt *= lerp(1, 0.4, game.focus) * lerp(1, 0.6, game.zhuSlow);
  game.comboT += dt;

  if (game.state === "serve") {
    if (ball) {
      ball.z = L.netH * 1.4 + Math.abs(Math.sin(game.time * 7)) * 10 * S;
      ball.x = game.server === "ai" ? ai.x + ai.dir * L.reach : player.x + player.dir * L.reach;
    }
    if (game.server === "ai") {
      game.serveT -= dt;
      if (game.serveT <= 0) { game.state = "play"; aiHit(); }
    }
  }
  if (game.state === "over") game.overT += dt;
  if (game.state === "dead") {
    game.deadT += dt;
    if (game.deadT > 0.7) awardPoint();
  }

  if (ball && !ball.still) {
    acc += pdt;
    while (acc >= STEP && ball) { acc -= STEP; physicsStep(); }
  } else acc = 0;

  for (const m of [player, ai]) { m.cheer = Math.max(0, m.cheer - dt); m.sad = Math.max(0, m.sad - dt); }
  game.sqT += pdt;
  game.pulse = Math.max(0, game.pulse - dt * 2);
  if (crowdGain && actx) {
    const target = muted || game.state !== "play" ? 0 : 0.05 * Math.min(1, game.rally / 30);
    crowdGain.gain.setTargetAtTime(target, actx.currentTime, 0.4);
  }
  moveMan(player, pdt, 7);
  if (game.mode === "match") moveAI(pdt); else moveMan(ai, pdt, 9);

  for (let i = effects.length - 1; i >= 0; i--) {
    effects[i].t += pdt;
    if (effects[i].t >= effects[i].dur) effects.splice(i, 1);
  }
  game.shake *= Math.exp(-12 * dt);

  if (ball && !ball.still) {
    if (pdt > 0) {
      trail.push({ x: ball.x, y: ball.y - ball.z });
      if (trail.length > (ball.smash ? 22 : 14)) trail.shift();
    }
  } else trail.length = 0;
}

/* ================= 绘制 ================= */

function armAngle(e, prep) {
  const rest = 0.5, t = e.swingT;
  const s = e.stroke || "top";
  const a0 = s === "chop" ? -1.0 : s === "flat" ? 0.6 : 0.95;
  const a1 = s === "chop" ? 0.9 : s === "flat" ? -0.9 : -1.35;
  if (t < 0.13) return lerp(a0, a1, easeOut(t / 0.13));
  if (t < 0.5) return lerp(a1, rest, easeInOut((t - 0.13) / 0.37));
  return lerp(rest, 1.05, prep || 0);
}

function drawStickman(e, flip, prep, color) {
  ctx.save();
  const hop = e.cheer > 0 ? Math.abs(Math.sin(e.cheer * 11)) * 7 * S * Math.min(1, e.cheer * 3) : 0;
  ctx.translate(e.x, e.y + (flip ? hop : -hop));
  const droop = e.sad > 0 ? 0.18 * Math.min(1, e.sad * 3) * (flip ? -1 : 1) : 0;   // 低头：上身前倾
  ctx.rotate((flip ? -e.lean : e.lean) + (e === player ? -e.dir * 0.12 * game.focus : 0) + droop * e.dir);
  ctx.scale(S, flip ? -S : S);
  ctx.strokeStyle = color || INK; ctx.fillStyle = color || INK;
  ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round";

  const sp = Math.abs(e.lean) * 40;
  const dir = e.dir;

  const headDrop = e.sad > 0 ? 5 * Math.min(1, e.sad * 3) : 0;
  ctx.beginPath(); ctx.arc(e.sad > 0 ? 3 * e.dir : 0, -45 + headDrop, 13, 0, TAU); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -32 + headDrop * 0.6); ctx.lineTo(0, 20); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, 20); ctx.lineTo(-12 - sp * 0.5, 38); ctx.lineTo(-22 - sp, 55);
  ctx.moveTo(0, 20); ctx.lineTo(12 + sp * 0.5, 38); ctx.lineTo(22 + sp, 55);
  ctx.stroke();

  let a = armAngle(e, prep);
  // 扣杀蓄力：高举球拍
  if (e === player && game.focus > 0.01 && e.swingT >= 0.5) a = lerp(a, -1.55, game.focus);
  if (e.cheer > 0) a = lerp(a, -2.1, Math.min(1, e.cheer * 4));       // 举拍庆祝
  else if (e.sad > 0) a = lerp(a, 1.35, Math.min(1, e.sad * 4));      // 垂拍
  const off = e.swingT < 0.4 ? 6 : 0;
  ctx.beginPath();
  ctx.moveTo(0, -15); ctx.lineTo(-dir * 14, -2 - off); ctx.lineTo(-dir * 22, 8 - off);
  ctx.stroke();

  ctx.save();
  ctx.translate(0, -15);
  ctx.scale(dir, 1);
  ctx.rotate(a);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(32, 0); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(32, 0); ctx.lineTo(40, 0); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(50, 0, 11, 12, 0, 0, TAU); ctx.fill();
  ctx.restore();

  ctx.restore();
}

function drawTable() {
  ctx.fillStyle = "rgba(0,0,0,0.07)";
  ctx.fillRect(L.tl, L.tt, L.tw, L.tb - L.tt);
  ctx.strokeStyle = INK; ctx.lineWidth = 3;
  ctx.strokeRect(L.tl, L.tt, L.tw, L.tb - L.tt);
  ctx.save();
  ctx.globalAlpha = 0.3; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(W / 2, L.tt); ctx.lineTo(W / 2, L.tb); ctx.stroke();
  ctx.restore();
}

// 瞄准点：显示"现在击球会落在哪里"
function drawAimMarker() {
  const b = ball;
  if (game.state !== "play" || !b || !b.toPlayer || b.error || b.still || b.vy <= 0) return;
  const te = timing(b);
  if (te < -ZE - 0.15 || te > ZL) return;
  const { bx0 } = aimX(clamp(te, -ZE, ZL), b.side);
  const x = clamp(bx0, L.tl + 0.03 * L.tw, L.tr - 0.03 * L.tw);
  const y = L.net - L.half * 0.65;
  const live = te >= -ZE;
  ctx.save();
  ctx.globalAlpha = live ? 0.5 : 0.18;
  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, y, 9 * S, 5 * S, 0, 0, TAU); ctx.stroke();
  ctx.fillStyle = INK;
  ctx.beginPath(); ctx.ellipse(x, y, 2.5 * S, 1.6 * S, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawNet() {
  const y = L.net, top = y - L.netH, x0 = L.tl - 10 * S, x1 = L.tr + 10 * S;
  ctx.strokeStyle = INK;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.55;
  for (let x = x0; x <= x1; x += 9 * S) {
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, y); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(x0, top); ctx.lineTo(x1, top); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x0, y + 4); ctx.lineTo(x0, top - 4);
  ctx.moveTo(x1, y + 4); ctx.lineTo(x1, top - 4);
  ctx.stroke();
}

function drawBall() {
  if (!ball) return;
  const b = ball;
  const r = L.ballR * (1 + b.z / (420 * S));
  const col = spinColor(b);

  ctx.fillStyle = `rgba(0,0,0,${0.22 * clamp(1 - b.z / (250 * S), 0.25, 1)})`;
  ctx.beginPath(); ctx.ellipse(b.x, b.y, L.ballR * 0.95, L.ballR * 0.55, 0, 0, TAU); ctx.fill();

  if (trail.length > 1) {
    ctx.lineCap = "round";
    ctx.strokeStyle = b.smash ? INK : col;
    const hv = isHeavy(b);
    for (let i = 1; i < trail.length; i++) {
      const a = i / trail.length;
      ctx.globalAlpha = a * (b.smash ? 0.85 : hv ? 0.6 : 0.22);
      ctx.lineWidth = r * (b.smash ? 2.4 : hv ? 1.8 : 1.2) * a;
      ctx.beginPath(); ctx.moveTo(trail[i - 1].x, trail[i - 1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  const bx = b.x, by = b.y - b.z;

  // 挤压形变：落台压扁，击球沿飞行方向拉长
  const sq = Math.max(0, 1 - game.sqT / 0.09);
  ctx.save();
  ctx.translate(bx, by);
  if (sq > 0) {
    if (game.sqType === "bounce") ctx.scale(1 + 0.35 * sq, 1 - 0.3 * sq);
    else {
      ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.scale(1 + 0.4 * sq, 1 - 0.25 * sq);
    }
  }
  ctx.translate(-bx, -by);

  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill();

  if (!b.still) {
    ctx.save();
    ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.clip();
    ctx.strokeStyle = col; ctx.lineWidth = 2 * S;
    if (Math.abs(b.spinS) > 0.2 && Math.abs(b.spinS) >= Math.abs(b.spinT)) {
      ctx.translate(bx, by);
      ctx.rotate(b.spin * Math.sign(b.spinS));
      ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(r, 0); ctx.stroke();
    } else {
      const ph = b.spin * Math.sign(b.spinT || 1) * Math.sign(b.vy || 1);
      for (const k of [0, Math.PI]) {
        if (Math.cos(ph + k) < 0) continue;
        const oy = Math.sin(ph + k) * r * 0.8;
        ctx.beginPath(); ctx.moveTo(bx - r, by + oy); ctx.lineTo(bx + r, by + oy); ctx.stroke();
      }
    }
    ctx.restore();
  }

  ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.stroke();
  ctx.restore();
}

function drawEffects() {
  for (const f of effects) {
    const k = f.t / f.dur;
    ctx.save();
    if (f.type === "ring") {
      ctx.globalAlpha = (1 - k) * 0.6;
      ctx.strokeStyle = INK; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(f.x, f.y, lerp(4, 24, k) * S, lerp(2, 12, k) * S, 0, 0, TAU); ctx.stroke();
    } else if (f.type === "burst") {
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.lineCap = "round";
      for (let i = 0; i < 7; i++) {
        const a = i / 7 * TAU + 0.3;
        const r0 = lerp(10, 22, k) * S, r1 = lerp(16, 32, k) * S;
        ctx.beginPath();
        ctx.moveTo(f.x + Math.cos(a) * r0, f.y + Math.sin(a) * r0);
        ctx.lineTo(f.x + Math.cos(a) * r1, f.y + Math.sin(a) * r1);
        ctx.stroke();
      }
    } else if (f.type === "bigring") {
      ctx.globalAlpha = (1 - k) * 0.8;
      ctx.strokeStyle = INK; ctx.lineWidth = 3.5;
      const cs = 1 + 0.25 * (f.chain || 0);
      ctx.beginPath(); ctx.ellipse(f.x, f.y, lerp(6, 46, easeOut(k)) * S * cs, lerp(3, 22, easeOut(k)) * S * cs, 0, 0, TAU); ctx.stroke();
    } else if (f.type === "splat") {
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = INK;
      for (let i = 0; i < 7; i++) {
        const a = f.seed + i * 0.9;
        const d = lerp(4, 26 + (i % 3) * 8, easeOut(k)) * S;
        ctx.beginPath(); ctx.arc(f.x + Math.cos(a) * d, f.y + Math.sin(a) * d * 0.5, (2.6 - (i % 3) * 0.6) * S, 0, TAU); ctx.fill();
      }
    } else if (f.type === "speed") {
      if (ball && ball.smash) {
        const sp = Math.hypot(ball.vx, ball.vy) || 1;
        const ux = -ball.vx / sp, uy = -ball.vy / sp;       // 指向球的后方
        const px = -uy, py = ux;
        const bx = ball.x, by = ball.y - ball.z;
        ctx.globalAlpha = (1 - k) * 0.7;
        ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.lineCap = "round";
        const nLines = 6 + (f.chain || 0) * 3;
        for (let i = 0; i < nLines; i++) {
          const o = (i - (nLines - 1) / 2) * 7 * S;
          const s0 = (14 + (i % 2) * 10) * S, len = (34 + (i * 13) % 30) * S;
          ctx.beginPath();
          ctx.moveTo(bx + ux * s0 + px * o, by + uy * s0 + py * o);
          ctx.lineTo(bx + ux * (s0 + len) + px * o, by + uy * (s0 + len) + py * o);
          ctx.stroke();
        }
      }
    } else if (f.type === "text") {
      ctx.globalAlpha = 1 - k * k;
      ctx.fillStyle = f.color;
      ctx.font = `bold ${Math.round(f.size * S)}px Arial, "PingFang SC", sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(f.text, f.x, f.y - k * 24 * S);
    }
    ctx.restore();
  }
}

// PERFECT 连击：画在最底层的半透明水印，不遮挡任何东西
function drawCombo() {
  const n = game.combo;
  if (n < 2 || game.state === "idle") return;
  const k = Math.min(n, 20) / 20;
  let size = lerp(18, 54, k) * S;
  const bump = game.comboT < 0.15 ? 1 + 0.15 * (1 - game.comboT / 0.15) : 1;
  const text = `PERFECT ×${n}`;
  ctx.save();
  ctx.font = `bold ${Math.round(size)}px Arial, sans-serif`;
  const w = ctx.measureText(text).width;
  if (w > W * 0.9) { size *= W * 0.9 / w; }
  ctx.font = `bold ${Math.round(size * bump)}px Arial, sans-serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.globalAlpha = 0.14 + 0.1 * k;
  ctx.fillStyle = INK;
  ctx.fillText(text, W / 2, (L.net + L.tb) / 2);
  ctx.restore();
}

// 老朱：3 个 PERFECT 削球计数点
function drawZhuDots() {
  if (game.char !== "zhu" || game.state === "idle") return;
  const y = player.y + 66 * S;
  ctx.save();
  ctx.strokeStyle = CHAR_COLOR.zhu; ctx.fillStyle = CHAR_COLOR.zhu; ctx.lineWidth = 2;
  const flash = ball && ball.fromZhu && game.focus > 0.05;
  const pulse = flash ? 1 + 0.35 * Math.abs(Math.sin(game.time * 14)) : 1;
  for (let i = 0; i < 3; i++) {
    const x = player.x + (i - 1) * 12 * S;
    ctx.beginPath(); ctx.arc(x, y, 3.5 * S * pulse, 0, TAU);
    if (flash || i < game.zhuDots) ctx.fill(); else ctx.stroke();
  }
  ctx.restore();
}

function draw() {
  // 冲击帧：柔和反色
  const saveInk = INK, saveBg = BG;
  if (game.impact > 0) { INK = "#f4d470"; BG = "#2a230c"; }

  ctx.save();
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  if (game.shake > 0.3) ctx.translate(rand(-1, 1) * game.shake, rand(-1, 1) * game.shake);

  // 镜头推近 / 回弹（以扣杀聚焦点为中心）
  if (Math.abs(game.zoom) > 0.0005) {
    const cx = ball ? lerp(ball.x, player.x, 0.35) : W / 2;
    const cy = ball ? lerp(ball.y - ball.z, L.playerY, 0.35) : H / 2;
    ctx.translate(cx, cy); ctx.scale(1 + game.zoom, 1 + game.zoom); ctx.translate(-cx, -cy);
  }
  drawCombo();

  ctx.save();
  ctx.globalAlpha = 0.08; ctx.strokeStyle = INK; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
  ctx.restore();

  drawTable();

  let aiPrep = 0, playerPrep = 0;
  if (ball && !ball.still && !ball.error && game.state === "play" && Math.abs(ball.vy) > 1) {
    if (!ball.toPlayer && !ball.aiMiss) aiPrep = clamp(1 - ((ball.y - L.aiHitY) / -ball.vy) / 0.22, 0, 1);
    else if (ball.toPlayer && ball.bounced) playerPrep = clamp(1 - ((L.playerHitY - ball.y) / ball.vy) / 0.3, 0, 0.6);
  }

  drawAimMarker();
  drawStickman(ai, true, aiPrep);
  const behind = ball && ball.y < L.net;
  if (behind) drawBall();
  drawNet();
  drawStickman(player, false, playerPrep, game.impact > 0 ? INK : playerColor());
  drawZhuDots();
  if (!behind) drawBall();
  drawEffects();

  if (game.pulse > 0) {           // 回合里程碑：背景轻轻脉动
    ctx.fillStyle = `rgba(255,255,255,${0.22 * game.pulse * game.pulse})`;
    ctx.fillRect(-40, -40, W + 80, H + 80);
  }

  if (game.focus > 0.01) {
    const fx = ball ? lerp(ball.x, player.x, 0.35) : player.x;
    const fy = ball ? lerp(ball.y - ball.z, L.playerY - 20 * S, 0.35) : L.playerY;
    const g = ctx.createRadialGradient(fx, fy, 70 * S, fx, fy, 210 * S);
    g.addColorStop(0, "rgba(0,0,0,0)");
    g.addColorStop(1, `rgba(0,0,0,${0.42 * game.focus})`);
    ctx.fillStyle = g;
    ctx.fillRect(-40, -40, W + 80, H + 80);
  }
  ctx.restore();
  INK = saveInk; BG = saveBg;
}

/* ================= 输入 ================= */

const SWIPE = 22;

function resolveGesture(stroke) {
  const g = gesture;
  gesture = null;
  if (g) doAction(g.dir, stroke, g);
}

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  ensureAudio();
  if (game.state === "idle") return;
  if (game.state === "over") { if (game.overT > 0.2) startMode(game.mode); return; }
  if (gesture) resolveGesture("flat");
  gesture = {
    id: e.pointerId, dir: e.clientX < W / 2 ? -1 : 1,
    y0: e.clientY, t0: game.time,
    zoneAtPress: inZone(ball), pressTe: inZone(ball) ? timing(ball) : 0, enteredTe: null
  };
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
}, { passive: false });

canvas.addEventListener("pointermove", e => {
  if (!gesture || e.pointerId !== gesture.id) return;
  const dy = e.clientY - gesture.y0;
  if (Math.abs(dy) > SWIPE) resolveGesture(dy < 0 ? "top" : "chop");
});

function pointerEnd(e) {
  if (!gesture || e.pointerId !== gesture.id) return;
  const dy = e.clientY - gesture.y0;
  resolveGesture(Math.abs(dy) > SWIPE ? (dy < 0 ? "top" : "chop") : "flat");
}
canvas.addEventListener("pointerup", pointerEnd);
canvas.addEventListener("pointercancel", pointerEnd);
canvas.addEventListener("contextmenu", e => e.preventDefault());

const KEYS = {
  a: [-1, "flat"], arrowleft: [-1, "flat"], d: [1, "flat"], arrowright: [1, "flat"],
  q: [-1, "top"], e: [1, "top"], z: [-1, "chop"], c: [1, "chop"]
};

window.addEventListener("keydown", e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  ensureAudio();
  if (!introEl.hidden) { if (k === "escape") endIntro(); else advanceIntro(); return; }
  if (k === "escape") { if (!helpEl.hidden) helpEl.hidden = true; else toIdle(); return; }
  if (game.state === "idle") {
    if (LEVELS[+k]) setLevel(+k);
    else if (k === "enter") startMode("match");
    else if (k === "p") openMode("practice");
    return;
  }
  if (game.state === "over") {
    if ((KEYS[k] || k === " ") && game.overT > 0.2) startMode(game.mode);
    return;
  }
  const m = KEYS[k];
  if (m) { e.preventDefault(); doAction(m[0], m[1], null); }
});

document.querySelectorAll(".modeBtn").forEach(btn => {
  btn.addEventListener("click", () => { btn.blur(); openMode(btn.dataset.mode); });
});
menuBtn.addEventListener("click", () => { menuBtn.blur(); toIdle(); });

const lvButtons = document.querySelectorAll("#levels button[data-lv]");
const lvInfo = document.getElementById("lvInfo");
const lvInfoBtn = document.getElementById("lvInfoBtn");

function renderLvInfo() {
  lvInfo.innerHTML = T("lvDesc").map((d, i) =>
    `<div class="${i + 1 === game.level ? "on" : ""}">${i + 1}　${d}</div>`).join("");
}
function setLevel(lv) {
  game.level = lv;
  try { localStorage.setItem("spp_level", lv); } catch (e) {}
  lvButtons.forEach(b => b.classList.toggle("on", +b.dataset.lv === lv));
  renderLvInfo();
}
lvButtons.forEach(b => b.addEventListener("click", () => { b.blur(); setLevel(+b.dataset.lv); }));
lvInfoBtn.addEventListener("click", () => {
  lvInfoBtn.blur();
  lvInfo.hidden = !lvInfo.hidden;
  lvInfoBtn.classList.toggle("on", !lvInfo.hidden);
});

helpBtn.addEventListener("click", () => { helpBtn.blur(); helpEl.hidden = false; });
helpEl.addEventListener("click", () => { helpEl.hidden = true; });

const charButtons = document.querySelectorAll("#chars button");
function setChar(c) {
  game.char = c;
  try { localStorage.setItem("spp_char", c); } catch (e) {}
  charButtons.forEach(b => b.classList.toggle("on", b.dataset.char === c));
}
charButtons.forEach(b => b.addEventListener("click", () => { b.blur(); setChar(b.dataset.char); }));

/* 进入无尽模式前的小对话，点击推进 / 跳过，2.6 秒自动推进 */
let introStep = 0, introDone = null, introTimer = null;
function showIntro(done) {
  introDone = done;
  introStep = 0;
  document.getElementById("introA").textContent = T("introA");
  document.getElementById("introB").textContent = T("introB");
  document.getElementById("introSkip").textContent = T("skip");
  document.getElementById("introHeadB").style.color = playerColor();
  document.getElementById("introLineB").hidden = true;
  menuEl.hidden = true;
  introEl.hidden = false;
  clearTimeout(introTimer);
  introTimer = setTimeout(advanceIntro, 2600);
}
function advanceIntro() {
  if (introEl.hidden) return;
  if (introStep === 0) {
    introStep = 1;
    document.getElementById("introLineB").hidden = false;
    clearTimeout(introTimer);
    introTimer = setTimeout(advanceIntro, 2000);
  } else endIntro();
}
function endIntro() {
  clearTimeout(introTimer);
  if (introEl.hidden) return;
  introEl.hidden = true;
  const d = introDone; introDone = null;
  if (d) d();
}
introEl.addEventListener("pointerdown", e => {
  e.preventDefault();
  ensureAudio();
  if (e.target.id === "introSkip") endIntro(); else advanceIntro();
});

function openMode(mode) {
  if (mode === "practice") showIntro(() => startMode("practice"));
  else startMode(mode);
}

function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  langBtn.textContent = lang === "zh" ? "EN" : "中";
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = T(e.dataset.i18n); });
  document.querySelectorAll("[data-i18n-char]").forEach(e => { e.textContent = T("chars")[e.dataset.i18nChar]; });
  document.getElementById("swipeHint").textContent = T("swipe");
  document.getElementById("helpText").innerHTML = T("help").join("<br>");
  renderLvInfo();
  if (game.state !== "idle") updateScore();
  if (game.state === "serve" && game.server === "player") msgEl.textContent = T("serveTip");
}
langBtn.addEventListener("click", () => {
  langBtn.blur();
  lang = lang === "zh" ? "en" : "zh";
  try { localStorage.setItem("spp_lang", lang); } catch (e) {}
  applyLang();
});

setLevel(game.level);
setChar(game.char);
applyLang();

/* ================= 主循环 ================= */

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const oW = W, oH = H;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout();
  player.y = L.playerY; ai.y = L.aiY;
  const big = Math.abs(W - oW) > 60 || Math.abs(H - oH) > 120;
  if (game.state === "idle" || big) toIdle();
}
window.addEventListener("resize", resize);

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);
</script>
</body>
